<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h2>Lista de Tareas</h2>
        <input type="text" id="newItem" placeholder="Nueva tarea">
        <button id="addBtn">Agregar</button>        
        <ul id="taskList">
            <li class="item task">Tarea de Programacion </li>
            <li class="item task">Tarea de Base de Datos 1</li>
            <li class="item task">Tarea de Ingles </li>
            <li class="item task">Tarea de Programacion Movil </li>
            <li class="item task">Tarea de programcion II</li>
            
        </ul>
        
        <div id="controls"> 
            <button id="toggleBtn">Tachar Último</button>
            <button id="countBtn">Contar Items</button>
        </div>
        <div id="output"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
